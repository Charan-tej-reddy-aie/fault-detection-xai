[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fault-detection-xai"
version = "0.1.0"
authors = [
  { name="Yammanuru Charan Tej Reddy" },
]
description = "Explainable Machine Fault Detection and Root-Cause Diagnosis using CNN, BiLSTM, Bayesian Networks, and SHAP"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.24.3,<2.0.0",
    "pandas>=2.0.0,<2.3.0",
    "scikit-learn>=1.3.0,<1.6.0",
    "pgmpy>=0.1.25",
    "shap>=0.44.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "imbalanced-learn>=0.11.0",
]

[project.optional-dependencies]
app = [
    "streamlit>=1.35.0",
    "Pillow>=9.5.0",
]

[project.urls]
"Homepage" = "https://github.com/Charan-tej-reddy-aie/fault-detection-xai"
"Bug Tracker" = "https://github.com/Charan-tej-reddy-aie/fault-detection-xai/issues"
